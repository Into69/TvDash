# Builds TvDash on every push to main and publishes it as release "build-<n>" (n = commit count,
# the app's versionCode). TVs install it from the Updates tile.
#
# Needs the repository secret DEBUG_KEYSTORE_BASE64: base64 of the debug.keystore the TVs' current
# builds were signed with (%USERPROFILE%\.android\debug.keystore). Android only accepts an update
# signed with the same key.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # SHA-256 of the signing certificate in DEBUG_KEYSTORE_BASE64 (public; identifies the key).
  SIGNING_CERT_SHA256: 28e445a784f17cc721b1548dad4f74379b45eb3057b61cec4be18f1df73a3f11

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the DEBUG_KEYSTORE_BASE64 secret, or the TVs will refuse this build."
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "TVDASH_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Ptvdash.updateRepo=${{ github.repository }}

      # Never publish an APK the TVs would refuse: its certificate must be the TVs' signing key.
      - name: Check signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$certs"
          # "Signer #1 certificate SHA-256 digest: …", worded differently by some apksigner versions.
          actual=$(echo "$certs" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}')
          if [ "$actual" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error::APK signed with $actual, expected $SIGNING_CERT_SHA256. Check DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(git rev-list --count HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "tvdash-build-$n.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$n" "tvdash-build-$n.apk" --title "Build $n" --notes-file notes.txt --target "$GITHUB_SHA"
