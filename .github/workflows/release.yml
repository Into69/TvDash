# Builds TvDash on every push to main and publishes it as release "build-<n>" (n = commit count,
# the app's versionCode). TVs install it from the Updates tile.
#
# Needs the repository secret DEBUG_KEYSTORE_BASE64: base64 of the debug.keystore the TVs' current
# builds were signed with (%USERPROFILE%\.android\debug.keystore). Android only accepts an update
# signed with the same key.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the DEBUG_KEYSTORE_BASE64 secret, or the TVs will refuse this build."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Ptvdash.updateRepo=${{ github.repository }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(git rev-list --count HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "tvdash-build-$n.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$n" "tvdash-build-$n.apk" --title "Build $n" --notes-file notes.txt --target "$GITHUB_SHA"
